services:
  berlin-insider:
    build: .
    image: berlin-insider:latest
    container_name: berlin-insider
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./.data:/app/.data
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
    env_file:
      - path: .env
        required: false
